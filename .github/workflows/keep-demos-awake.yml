# Keeps the five Render demos awake during Japan working hours on weekdays.
# Render's free plan sleeps a service after 15 minutes without traffic and allows 750 running hours a month
# per workspace, shared by all services. This window (≈5 h/day × 5 services × ≤23 weekdays ≈ 600 h) stays
# inside that limit; a 24/7 pinger would exhaust it and get every demo suspended for the rest of the month.
name: Keep project demos awake

on:
  schedule:
    - cron: "*/10 0-4 * * 1-5"   # every 10 minutes, 00:00–04:50 UTC = 09:00–13:50 JST, Monday–Friday
  workflow_dispatch: {}          # manual run from the Actions tab

permissions: {}

concurrency:
  group: keep-demos-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping each demo (up to 3 attempts; fails, and GitHub emails you, if one stays down)
        run: |
          down=0
          while read -r name url; do
            ok=0
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$url" || echo 000)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 15
            done
            echo "$name: HTTP $code (attempts: $attempt)"
            [ "$ok" = 1 ] || down=1
          done <<'LIST'
          GraphMind https://graphmind-n10l.onrender.com/health
          CreditCompass https://creditcompass-h0m5.onrender.com/openapi.json
          Moodalyx https://moodalyx.onrender.com/health
          Scholaryx https://scholaryx.onrender.com/api/health
          Warehouse https://warehouse-amr-fleet.onrender.com/
          LIST
          exit $down
